<!-- ═══════════ MFD ═══════════ -->
<div id="page-mfd" class="page">
  <h1>Magnitude-Frequency Distribution</h1>
  <p>Completeness-corrected MFD for OpenQuake source models
    (<a href="https://docs.openquake.org/oq-engine/manual/master/api-reference/openquake.hazardlib.mfd.html" target="_blank" style="color:var(--accent)">ArbitraryMFD / TruncatedGRMFD</a>).</p>

  <div class="form-row">
    <div class="form-group">
      <label><input type="checkbox" id="mfd-usedefault" checked> Use PHIVOLCS default catalog (1907&ndash;2025, 3,577 events)</label>
    </div>
  </div>

  <div class="file-upload" id="mfd-drop">
    Or upload a declustered catalog CSV (time, mag, depth) to override the default
    <input type="file" accept=".csv" id="mfd-file">
  </div>

  <div id="mfd-cols">
    <div class="form-row">
      <div class="form-group"><label>Magnitude col</label><input id="mfd-mag" value="mag"></div>
      <div class="form-group"><label>Time col</label><input id="mfd-time" value="time"></div>
      <div class="form-group"><label>Depth col</label><input id="mfd-depth" value="depth"></div>
      <div class="form-group"><label>Bin width (dm)</label><input type="number" id="mfd-dm" value="0.1" step="0.05"></div>
      <div class="form-group"><label>Min magnitude</label><input type="number" id="mfd-minmag" value="4.5" step="0.1"></div>
      <div class="form-group"><label>Max magnitude</label><input type="number" id="mfd-maxmag" value="8.0" step="0.1"></div>
    </div>

    <h2>Completeness Tables (year, magnitude per line)</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Shallow (0&ndash;35 km)</label>
        <textarea id="mfd-shallow" rows="8">1980,4.8
1964,5.0
1955,5.8
1943,6.2
1930,6.7
1920,7.0
1863,7.5
1619,8.0</textarea>
      </div>
      <div class="form-group">
        <label>Mid-depth (35&ndash;70 km)</label>
        <textarea id="mfd-mid" rows="8">1976,4.8
1963,5.0
1957,5.9
1949,6.6
1903,7.0
1884,7.2
1852,7.6</textarea>
      </div>
      <div class="form-group">
        <label>Deep (70&ndash;700 km)</label>
        <textarea id="mfd-deep" rows="8">1988,4.8
1963,5.2
1871,7.0</textarea>
      </div>
    </div>

    <button class="btn btn-primary" id="mfd-run" onclick="runMFD()">Compute MFD</button>
    <span class="spinner" id="mfd-spin"></span>
  </div>

  <div id="mfd-results"></div>
</div>
